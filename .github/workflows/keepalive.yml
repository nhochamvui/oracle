# .github/workflows/keepalive.yml
#
# GitHub auto-disables SCHEDULED workflows after 60 days of no repository
# activity. This job makes one tiny commit per month so your oci-arm-retry
# schedule never gets killed.
#
# Copy to: .github/workflows/keepalive.yml
#
# Requires write access for the workflow token:
#   Settings -> Actions -> General -> Workflow permissions
#     -> "Read and write permissions"
name: keepalive

on:
  schedule:
    - cron: "0 3 1 * *"     # 03:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive file
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
